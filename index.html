  <script>
  var form = document.getElementById("my-form");

  async function handleSubmit(event) {
    event.preventDefault();

    var success = document.querySelector(".message-success");
    var warning = document.querySelector(".message-warning");

    // Hide both messages initially
    success.style.display = "none";
    warning.style.display = "none";

    var data = new FormData(event.target);

    fetch(event.target.action, {
      method: form.method,
      body: data,
      headers: {
        'Accept': 'application/json'
      }
    }).then(response => {
      if (response.ok) {
        success.style.display = "block";
        form.reset();
      } else {
        response.json().then(data => {
          if (Object.hasOwn(data, 'errors')) {
            warning.innerText = data["errors"].map(error => error["message"]).join(", ");
          } else {
            warning.innerText = "Oops! There was a problem submitting your form";
          }
          warning.style.display = "block";
        });
      }
    }).catch(error => {
      warning.innerText = "Oops! There was a problem submitting your form";
      warning.style.display = "block";
    });
  }

  form.addEventListener("submit", handleSubmit);
</script>
